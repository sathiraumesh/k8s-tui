# Tests every push and pull request, and builds k8s-tui for Linux, macOS
# and Windows on amd64 (x86-64) and arm64. Publishing a release on GitHub
# (Releases › Draft a new release › Publish release) builds them from its
# tag and attaches the compiled binaries to it, ready to download and run,
# with their checksums (SHA256SUMS).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for git describe
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          # A release's tag (v1.2.3); else what git describes, e.g. v1.2.3-4-gabc1234.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG:-$(git describe --tags --always --dirty)}"
          # The binary itself, ready to run: k8s-tui_v1.2.3_linux_arm64,
          # k8s-tui_v1.2.3_windows_amd64.exe.
          bin="k8s-tui_${version}_${GOOS}_${GOARCH}"
          [ "$GOOS" = windows ] && bin="$bin.exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/$bin" .
      - name: Check it runs
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/k8s-tui_*_linux_amd64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: k8s-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the files to the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
