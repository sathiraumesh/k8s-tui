# Tests every push and pull request, and builds k8s-tui for Linux, macOS
# and Windows on amd64 (x86-64) and arm64.
#
# It also makes releases itself, with the compiled binaries attached, ready
# to download and run, and their checksums (SHA256SUMS). Either:
#
#   - push a tag:  git tag v0.1.0 && git push origin v0.1.0
#   - or on GitHub: Actions › CI › Run workflow, and type the version (v0.1.0):
#     it tags the commit of the branch it runs on.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (a new tag)"
        required: true

permissions:
  contents: read

# The release's version: the one typed, or the tag pushed; "" otherwise.
env:
  RELEASE_TAG: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        if: env.RELEASE_TAG != ''
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' isn't a version like v1.2.3 (or v1.2.3-rc.1)"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for git describe
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          # The release's version, else what git describes, e.g. v1.2.3-4-gabc1234.
          version="${RELEASE_TAG:-$(git describe --tags --always --dirty)}"
          # The binary itself, ready to run: k8s-tui_v1.2.3_linux_arm64,
          # k8s-tui_v1.2.3_windows_amd64.exe.
          bin="k8s-tui_${version}_${GOOS}_${GOARCH}"
          [ "$GOOS" = windows ] && bin="$bin.exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/$bin" .
      - name: Check it runs
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/k8s-tui_*_linux_amd64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: k8s-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to make the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a "-" (v1.2.3-rc.1) is a pre-release.
          prerelease=""
          [[ "$RELEASE_TAG" == *-* ]] && prerelease="--prerelease"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Made already (run again): only replace its files.
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # The tag pushed, or, from Run workflow, a new one on this commit.
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes $prerelease
          fi
